<title>Club 2500 Ascent</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4E6;--sf:#FFFFFF;--ink:#3F2A3B;--mut:#8A6F83;--ln:#F3DDE7;--pri:#FF5C93;--gold:#FFC83D;--sky:#E4D9FF;--ol:#3F2A3B;--sh:#3F2A3B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241632;--sf:#34224A;--ink:#FFF1E6;--mut:#C7AEDB;--ln:#3E2C57;--pri:#FF7FAA;--gold:#FFD66B;--sky:#4B3A78;--ol:#FFE9F1;--sh:#120A1C}}
:root[data-theme="dark"]{--bg:#241632;--sf:#34224A;--ink:#FFF1E6;--mut:#C7AEDB;--ln:#3E2C57;--pri:#FF7FAA;--gold:#FFD66B;--sky:#4B3A78;--ol:#FFE9F1;--sh:#120A1C}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) radial-gradient(var(--ln) 1.6px,transparent 1.6px) 0 0/18px 18px;color:var(--ink);font:500 15px/1.45 Nunito,system-ui,sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100vh;padding:14px 16px 112px}
h1,h2,.big,.brand,.rk,.stats b{font-family:Fredoka,Nunito,sans-serif}
h1{margin:0;font-size:32px;font-weight:700}
h2{margin:0 0 12px;font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px}
.sub{color:var(--mut);margin:2px 0 14px;font-weight:700}.mut{color:var(--mut)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:3px}
.brand{display:flex;align-items:center;height:34px;margin-bottom:10px;font-size:20px;font-weight:700;color:var(--pri)}
.brand img{height:100%;width:auto;display:block}
.hero{position:relative;background:var(--sky);border:3px solid var(--ol);border-radius:24px;box-shadow:5px 5px 0 var(--sh);overflow:hidden}
.hero svg{display:block;width:100%;height:auto}
.me{position:absolute;transform:translate(-50%,-78%);transition:left .9s ease,top .9s ease}
.av{--s:44px;width:var(--s);height:var(--s);display:inline-block;position:relative;flex:none}
.av svg{width:100%;height:100%;display:block;overflow:visible}
.av i{position:absolute;top:-6%;left:50%;transform:translateX(-50%);font-style:normal;font-size:calc(var(--s)*.38);line-height:1}
.score{display:flex;align-items:baseline;gap:8px;margin:18px 0 4px}
.big{font-size:50px;font-weight:700;line-height:1;color:var(--pri)}
.cta{width:100%;margin:12px 0 8px;padding:14px;border:3px solid var(--ol);border-radius:18px;background:var(--pri);color:#3F2A3B;font:700 19px Fredoka,sans-serif;box-shadow:4px 4px 0 var(--sh);transition:transform .1s,box-shadow .1s}
.cta:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--sh)}.cta[disabled]{opacity:.5}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:104px}
.m{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font:700 10px Nunito;color:var(--mut)}
.m div{width:100%;border:2px solid var(--ol);border-radius:8px 8px 0 0;background:var(--sf);min-height:6px}
.m.q div{background:var(--gold)}.m.now div{background:var(--pri)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 6px}
.stats>div{background:var(--sf);border:2.5px solid var(--ol);border-radius:16px;box-shadow:3px 3px 0 var(--sh);padding:8px 10px;font-size:12px;font-weight:700}
.stats b{display:block;font-size:24px;line-height:1.1;color:var(--ink)}
.live{display:inline-flex;align-items:center;gap:5px;font:800 12px Nunito;color:#3F2A3B;background:var(--gold);border:2px solid var(--ol);border-radius:99px;padding:1px 9px}
.live i{width:8px;height:8px;border-radius:50%;background:#FF3D6E;animation:p 1.2s infinite}@keyframes p{50%{opacity:.25}}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.chip{background:var(--gold);color:#3F2A3B;border:2px solid var(--ol);border-radius:99px;padding:2px 11px;font-size:13px;font-weight:800}
.row{display:grid;grid-template-columns:26px 42px 1fr auto;gap:10px;align-items:center;padding:8px 12px;margin-bottom:11px;background:var(--sf);border:2.5px solid var(--ol);border-radius:18px;box-shadow:3px 3px 0 var(--sh)}
.row.you{background:var(--ln)}
.row.you{background:color-mix(in srgb,var(--pri) 24%,var(--sf))}
.row.fl{animation:f 1s}@keyframes f{from{background:var(--gold)}}
.rk{font-size:19px;font-weight:700;color:var(--mut)}
.bar{height:11px;background:var(--ln);border:2px solid var(--ol);border-radius:6px;margin-top:4px;overflow:hidden}
.bar u{display:block;height:100%;background:var(--pri)}.row.qd .bar u{background:var(--gold)}
.pts{font:700 17px Fredoka,sans-serif;text-align:right}
.rw{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:12px;margin-bottom:13px;background:var(--sf);border:2.5px solid var(--ol);border-radius:20px;box-shadow:4px 4px 0 var(--sh)}
.rw .ic{font:700 32px Fredoka,sans-serif;width:60px;height:60px;display:grid;place-items:center;border-radius:16px;border:2.5px solid var(--ol);background:var(--sky)}
.rw.lock .ic{background:repeating-linear-gradient(45deg,#FFB3C7 0 8px,#FFD3E0 8px 16px);color:#3F2A3B}
.btn{border:2.5px solid var(--ol);background:var(--gold);color:#3F2A3B;border-radius:12px;padding:7px 13px;font-weight:800;box-shadow:2px 2px 0 var(--sh)}
.btn[disabled]{background:var(--ln);color:var(--mut);box-shadow:none;cursor:default}
.al{padding:11px 0;border-bottom:2px dashed var(--ln);display:flex;justify-content:space-between;gap:12px}
.pick{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 18px}
.pick button{width:56px;height:56px;border-radius:16px;border:2.5px solid var(--ol);background:var(--sf);font-size:22px;display:grid;place-items:center;padding:0}
.pick button.on{background:var(--gold);box-shadow:3px 3px 0 var(--sh)}.pick button[disabled]{opacity:.35}.sw{border-radius:50%!important}
input{font:inherit;width:100%;padding:11px 13px;border:2.5px solid var(--ol);border-radius:14px;background:var(--sf);color:var(--ink);margin:6px 0 16px}
input[type=file]{padding:9px}label{font-weight:800}
.ban{background:var(--gold);color:#3F2A3B;border:2.5px solid var(--ol);border-radius:14px;padding:9px 12px;margin:0 0 14px;font-size:14px;font-weight:700}
.adm label{display:block;margin-top:12px}.adm pre{background:var(--sf);border:2.5px solid var(--ol);padding:10px;border-radius:14px;overflow-x:auto;font-size:13px}
.err{color:var(--pri);font-weight:800}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:3px solid var(--ol);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:430px;margin:auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:6px 6px 4px}
nav button{background:none;border:0;padding:4px 0;font:800 11px Nunito,sans-serif;color:var(--mut);position:relative;border-radius:14px}
nav button span{height:30px;display:grid;place-items:center;font-size:20px}
nav button.on{background:var(--gold);color:#3F2A3B}
nav em{position:absolute;top:0;left:56%;background:var(--pri);color:#3F2A3B;border:2px solid var(--ol);border-radius:99px;font:800 10px Nunito,sans-serif;padding:0 5px;font-style:normal}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);border:2.5px solid var(--ol);border-radius:16px;box-shadow:3px 3px 0 var(--sh);padding:10px 16px;max-width:90%;z-index:9;transition:transform .3s;font-weight:700}
#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button.chip{font-family:inherit;cursor:pointer}.chip.off{background:var(--sf);color:var(--ink)}
select{font:inherit;width:100%;padding:10px 12px;border:2.5px solid var(--ol);border-radius:14px;background:var(--sf);color:var(--ink);margin:0 0 16px}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
#app{min-height:100vh;min-height:100dvh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{touch-action:manipulation}
input:not([type=file]),select{font-size:16px;-webkit-appearance:none;appearance:none}
select{padding-right:36px;background-repeat:no-repeat;background-position:right 12px center;background-size:12px 8px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23FF5C93' stroke-width='2.5' stroke-linecap='round'/></svg>")}
button.chip{min-height:36px;padding:5px 14px}
.typing nav{display:none}
.tip{margin-top:16px;padding:12px;border:2.5px dashed var(--ol);border-radius:16px;background:var(--sf);font-size:14px}
</style></head>
<body><div id="app"><div class="brand" id="logo" role="img" aria-label="Herbalife">Herbalife</div><div id="view"></div></div><div id="toast" role="status"></div>
<nav><div id="nav"></div></nav>
<script>
const $=s=>document.querySelector(s);
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],G=2500,YR=new Date().getFullYear(),CUR=new Date().getMonth();
const k=s=>String(s==null?'':s).trim().toLowerCase();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ym=i=>`${YR}-${String(i+1).padStart(2,'0')}`;
const lab=key=>new Date(key+'-01T00:00:00').toLocaleDateString('en',{month:'long',year:'numeric'});
const fd=d=>new Date(d).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const fmt=n=>n.toLocaleString('en-US');
const EM=[0,1,2,3,4,5],CO=['#FFB3C7','#CDB8FF','#BDEBD3','#FFE29A','#B8E0FF','#FFC9A8'];
const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const hist=[2650,2510,1900,2600,2520,2300,2580,2700,2400,2550];
const bots=[['Mei Lin Tan','🐼','#7FC8D9',2310],['Arisara Chai','🦁','#F2B632',2180],['Kenji Mori','🦅','#9AA5F0',1960],['Nguyen Thu Ha','🐉','#E2573F',1720],['Priya Nair','🦊','#F59E6B',1540],['Jiwoo Han','🐼','#B79CED',1210],['Wei Zhang','🦁','#6FD1A0',980],['Siti Aminah','🦅','#F0A6C8',760],['Dewi Lestari','🐉','#8FB8DE',540],['Carlos Reyes','🦊','#D9C27A',380]].map(([name,emoji,color,pts])=>({name,emoji,color,pts}));
const RW=[[500,'Camp Flag','Plant a flag on your mountain','🚩'],[1000,'Trail Cap','Avatar cap, ready to wear','🧢'],[1800,'Ridge Medal','Avatar medal, ready to wear','🏅'],[2500,'Club 2500 Crown','Avatar crown and Summit Club status','👑']];
const ACC={'🧢':1000,'🏅':1800,'👑':2500};
let db=null,pdoc=null,isAdmin=false,mode='demo',months={},shown=null,board=[],tab='climb',flash=null,unread=0,draft=null,dYear=YR,cf='',pick=null,saving=false,dirty=false;
['Singapore','Thailand','Japan','Vietnam','India','South Korea','China','Malaysia','Indonesia','Philippines'].forEach((c,i)=>bots[i].country=c);
const prof={key:'',emoji:0,color:'#FFB3C7',acc:'',claimed:[]},demo={pts:1350},alerts=[];
function entries(){let L;
 if(mode==='demo'){L=bots.map(b=>({...b,key:k(b.name)}));L.push({key:'__me',name:'You',country:'',pts:demo.pts,isMe:true})}
 else L=board.map(p=>({key:p.id,name:p.name,country:p.country||'',pts:p.pts,isMe:!!prof.key&&p.id===prof.key}));
 return L.map(p=>p.isMe?{...p,emoji:prof.emoji,color:prof.color,acc:prof.acc}:{...p,emoji:hash(p.name)%6,color:CO[hash(p.name+'x')%6],acc:''}).sort((a,b)=>b.pts-a.pts)}
const meE=()=>entries().find(p=>p.isMe);
const myPts=()=>{const e=meE();return e?e.pts:null};
const rank=()=>{const i=entries().findIndex(p=>p.isMe);return i<0?null:i+1};
const rankIn=L=>{if(!prof.key)return null;const i=[...L].sort((a,b)=>b.pts-a.pts).findIndex(p=>p.id===prof.key);return i<0?null:i+1};
const av=(p,s=44)=>{const n=Number.isInteger(+p.emoji)&&p.emoji!==''?((+p.emoji%6)+6)%6:hash(String(p.emoji))%6,c=p.color,o='#3F2A3B',tx=[16,10,20,8,18,13][n],tip=[4,12,20,6,16,9][n];
const eyes=[`<circle cx="36" cy="52" r="7" fill="#fff" stroke="${o}" stroke-width="2.5"/><circle cx="64" cy="52" r="7" fill="#fff" stroke="${o}" stroke-width="2.5"/><circle cx="37" cy="53" r="3.2" fill="${o}"/><circle cx="63" cy="53" r="3.2" fill="${o}"/>`,
`<path d="M29 54 Q36 46 43 54M57 54 Q64 46 71 54" fill="none" stroke="${o}" stroke-width="3.5" stroke-linecap="round"/>`,
`<circle cx="36" cy="52" r="5.5" fill="${o}"/><circle cx="64" cy="52" r="5.5" fill="${o}"/><circle cx="34.5" cy="50" r="1.8" fill="#fff"/><circle cx="62.5" cy="50" r="1.8" fill="#fff"/>`,
`<circle cx="36" cy="52" r="7" fill="#fff" stroke="${o}" stroke-width="2.5"/><circle cx="37" cy="53" r="3.2" fill="${o}"/><path d="M57 53 Q64 47 71 53" fill="none" stroke="${o}" stroke-width="3.5" stroke-linecap="round"/>`][n%4];
return `<span class="av" style="--s:${s}px"><svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="${o}" stroke-width="3" stroke-linejoin="round"><polygon points="${tx},${tip} 18,50 46,30" fill="${c}"/><polygon points="${100-tx},${tip} 82,50 54,30" fill="${c}"/><ellipse cx="50" cy="60" rx="35" ry="32" fill="${c}"/></g><polygon points="${tx+5},${tip+11} 26,46 40,35" fill="#FF8FB3"/><polygon points="${95-tx},${tip+11} 74,46 60,35" fill="#FF8FB3"/>${eyes}<circle cx="25" cy="67" r="5" fill="#FF8FB3" opacity=".7"/><circle cx="75" cy="67" r="5" fill="#FF8FB3" opacity=".7"/><path d="M29 70 Q50 94 71 70 Z" fill="${o}" stroke="${o}" stroke-width="2" stroke-linejoin="round"/><polygon points="32,71 37,79 42,72 47,81 53,72 58,81 63,72 67,79 70,71" fill="#fff"/></svg>${p.acc?`<i>${p.acc}</i>`:''}</span>`};

const title=()=>{const v=myPts()||0;return v>=G?'Summit Club':v>=1800?'High Camp':v>=1000?'Ridge Walker':v>=500?'Base Camp':'Trailhead'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2800)}
function note(msg){alerts.unshift({msg,t:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});if(tab!=='alerts')unread++;toast(msg);nav()}
function save(){if(!pdoc)return;if(saving){dirty=true;return}saving=true;pdoc.set({key:prof.key,emoji:prof.emoji,color:prof.color,acc:prof.acc,claimed:prof.claimed}).catch(()=>{}).then(()=>{saving=false;if(dirty){dirty=false;save()}})}
function nav(){const T=[['climb','⛰️','Climb'],['ranks','🏆','Ranks'],['rewards','🎁','Rewards'],['alerts','🔔','Alerts'],['me',av(prof,30),'Me']];if(isAdmin)T.push(['admin','📋','Upload']);
$('#nav').innerHTML=T.map(([x,i,l])=>`<button class="${tab===x?'on':''}" data-t="${x}"><span>${i}</span>${l}${x==='alerts'&&unread?`<em>${unread}</em>`:''}</button>`).join('')}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;if(tab==='alerts')unread=0;render();scrollTo(0,0)};
const banner=()=>mode==='demo'?'<div class="ban">Demo data. The campaign admin hasn’t uploaded real results yet.</div>':'';
function climb(){const mp=myPts(),pts=mp||0,p=Math.min(pts/G,1),r=rank();let qm=0;
const bars=MO.map((m,i)=>{let v=0;if(mode==='demo')v=i<CUR?(hist[i]||0):i===CUR?demo.pts:0;else{const d=months[ym(i)],e=d&&prof.key&&d.players.find(x=>x.id===prof.key);v=e?e.pts:0}
 if(v>=G)qm++;return `<div class="m ${v>=G?'q':i===CUR?'now':''}"><div style="height:${Math.round(Math.min(v/G,1)*100)}%"></div>${m[0]}</div>`}).join('');
const msg=mode==='live'&&mp===null?'Enter your name in Me to see your own progress.':pts>=G?'You’re in Club 2500 this month.':fmt(G-pts)+' points to the summit.'+(r?' You’re #'+r+' on the board.':'');
return `<h1>Club 2500</h1><p class="sub">${mode==='live'?lab(shown):MO[CUR]} climb · reach ${fmt(G)} points to qualify</p>${banner()}
<div class="hero"><svg viewBox="0 0 360 220" aria-hidden="true"><g stroke="#3F2A3B" stroke-width="3" stroke-linejoin="round"><polygon points="0,220 60,130 130,150 200,70 250,100 310,30 360,200 360,220" fill="#BDEBD3"/><polygon points="0,220 0,170 90,115 170,170 240,95 360,220" fill="#FFE29A"/></g><g fill="#fff" stroke="#3F2A3B" stroke-width="2.5"><ellipse cx="60" cy="38" rx="26" ry="12"/><ellipse cx="86" cy="34" rx="18" ry="10"/></g><text x="150" y="42" font-size="16" fill="#FF5C93">✦</text><text x="330" y="92" font-size="14" fill="#FF5C93">✦</text>
<path d="M30 200 L120 165 L70 125 L190 100 L140 65 L250 55 L305 22" fill="none" stroke="#3F2A3B" stroke-opacity=".55" stroke-width="4" stroke-dasharray="1 9" stroke-linecap="round" pathLength="100"/>
<path id="trail" d="M30 200 L120 165 L70 125 L190 100 L140 65 L250 55 L305 22" fill="none" stroke="#FF5C93" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="${p*100} 100"/>
<text x="294" y="20" font-size="22">👑</text></svg><div class="me" id="pin">${av({emoji:prof.emoji,color:prof.color,acc:prof.acc},40)}</div></div>
<div class="score"><span class="big">${fmt(pts)}</span><span class="mut">of ${fmt(G)} points · ${title()}</span></div>
<p class="mut" style="margin:0">${msg}</p>
${mode==='demo'?'<button class="cta" id="log">Log a sale</button>':`<p class="mut" style="margin:10px 0 0">Results updated ${fd(months[shown].updatedAt)}.</p>`}
<h2 style="margin-top:22px">Monthly progress</h2><div class="months">${bars}</div>
<div class="stats"><div><b>${qm}</b><span class="mut">months qualified</span></div><div><b>${r?'#'+r:'–'}</b><span class="mut">this month</span></div><div><b>${RW.filter(x=>pts>=x[0]).length}/4</b><span class="mut">rewards</span></div></div>`}
function ranks(){const A=entries(),cs=[...new Set(A.map(p=>p.country).filter(Boolean))].sort();if(cf&&!cs.includes(cf))cf='';
const all=cf?A.filter(p=>p.country===cf):A,q=all.filter(p=>p.pts>=G),nm=p=>p.isMe&&mode==='demo'?'You':esc(p.name)+(p.isMe?' (you)':'');
const R=(p,i)=>`<div class="row ${p.isMe?'you':''} ${p.pts>=G?'qd':''} ${p.key===flash?'fl':''}"><span class="rk">${i+1}</span>${av(p,38)}<div><b>${nm(p)}</b>${p.pts>=G?' ✓':''}${p.country?`<div class="mut" style="font-size:12px;font-weight:700">${esc(p.country)}</div>`:''}<div class="bar"><u style="width:${Math.min(p.pts/G,1)*100}%"></u></div></div><span class="pts">${fmt(p.pts)}</span></div>`;
let h=all.slice(0,50).map(R).join('');const mi=all.findIndex(p=>p.isMe);if(mi>=50)h+='<p class="mut" style="margin:12px 0 0">Your position</p>'+R(all[mi],mi);
const ks=Object.keys(months).sort(),mc=ks.length>1?`<div class="chips">${ks.map(m=>`<button class="chip ${m===shown?'':'off'}" data-mo="${m}">${MO[+m.slice(5)-1]}${+m.slice(0,4)===YR?'':' '+m.slice(0,4)}</button>`).join('')}</div>`:'';
const sel=cs.length>1?`<select id="cf" aria-label="Country"><option value="">All countries</option>${cs.map(c=>`<option value="${esc(c)}" ${c===cf?'selected':''}>${esc(c)}</option>`).join('')}</select>`:'';
return `<h1>Leaderboard</h1><p class="sub"><span class="live"><i></i>${mode==='live'?'LIVE':'DEMO'}</span> ${mode==='live'?lab(shown)+' · updated '+fd(months[shown].updatedAt):'Updates as qualifiers log points'}</p>${banner()}${mc}${sel}
<h2>Club 2500 qualifiers (${q.length})</h2><div class="chips">${q.length?q.slice(0,40).map(p=>`<span class="chip">${p.isMe&&mode==='demo'?'You':esc(p.name)}</span>`).join('')+(q.length>40?`<span class="mut">+${q.length-40} more</span>`:''):'<span class="mut">No one has reached 2,500 yet. Be first.</span>'}</div>${h||'<p class="mut">No results yet.</p>'}`}
function rewards(){const pts=myPts()||0;return `<h1>Rewards</h1><p class="sub">Each milestone unlocks something for your avatar</p>${RW.map((r,i)=>{const u=pts>=r[0],id=(shown||'demo')+':'+i,c=prof.claimed.includes(id);return `<div class="rw ${u?'':'lock'}"><span class="ic">${u?r[3]:'?'}</span><div><b>${r[1]}</b><div class="mut">${r[2]}</div><div class="mut">${fmt(r[0])} points</div></div><button class="btn" data-c="${i}" ${u&&!c?'':'disabled'}>${c?'Claimed':u?'Claim':'Locked'}</button></div>`}).join('')}`}
function alertsV(){return `<h1>Alerts</h1><p class="sub">Qualifiers, rank changes and rewards</p>${alerts.length?alerts.map(a=>`<div class="al"><span>${esc(a.msg)}</span><span class="mut">${a.t}</span></div>`).join(''):'<p class="mut">Nothing yet. Alerts appear when the board changes.</p>'}`}
function tip(){if((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone)return'';const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
return `<div class="tip"><b>Add to your home screen</b><br>${ios?'In Safari, tap the Share button, then <b>Add to Home Screen</b>.':/Android/.test(ua)?'In Chrome, tap the ⋮ menu, then <b>Add to Home screen</b> or <b>Install app</b>.':'Open this link on your phone in Safari (iPhone) or Chrome (Android), then add it to your home screen.'}</div>`}
function meV(){const pts=myPts()||0,e=meE();
const st=mode==='demo'?'Linking works once the admin has uploaded results.':!prof.key?'Enter your name to see your own progress.':e?'Linked to '+esc(e.name)+'.':'No match in the latest results yet.';
return `<h1>Your avatar</h1><p class="sub">${title()}</p><div style="margin:6px 0 18px">${av(prof,92)}</div>
<label for="did">Your name</label><input id="did" value="${esc(prof.key)}" placeholder="As it appears in the results file" maxlength="40"><p class="mut" style="margin:-8px 0 16px">${st}</p>
<label>Character</label><div class="pick">${EM.map(x=>`<button data-e="${x}" class="${prof.emoji===x?'on':''}" aria-label="Character ${x+1}">${av({emoji:x,color:prof.color,acc:''},40)}</button>`).join('')}</div>
<label>Color</label><div class="pick">${CO.map(c=>`<button class="sw ${prof.color===c?'on':''}" data-k="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join('')}</div>
<label>Gear</label><div class="pick"><button data-a="" class="${prof.acc===''?'on':''}" aria-label="No gear">∅</button>${Object.keys(ACC).map(a=>`<button data-a="${a}" class="${prof.acc===a?'on':''}" ${pts>=ACC[a]?'':'disabled'} aria-label="Gear ${a}">${a}</button>`).join('')}</div>
<p class="mut">Gear unlocks as you pass reward milestones. Other people see you with a default avatar.</p>${tip()}`}
function adminV(){const ks=Object.keys(months).sort().reverse();let d='';
if(draft){const ml=draft.months?draft.months.map(m=>MO[m]).join(', '):'';
d=draft.err?`<p class="err">${esc(draft.err)}</p>`:`<h2 style="margin-top:20px">Preview</h2><p>${draft.rows.length} rows. Months found: ${ml} ${draft.year}.${draft.skip?` ${draft.skip} rows skipped (missing name or points).`:''} Publishing replaces those months.</p>${draft.rows.slice(0,5).map(p=>`<div class="al"><span><b>${esc(p.name)}</b><br><span class="mut">${esc(p.country)}</span></span><span class="mut" style="text-align:right">${draft.months.map(m=>MO[m]+' '+(p.v[m]===undefined?'–':fmt(p.v[m]))).join(' · ')}</span></div>`).join('')}<button class="cta" id="pub">Publish ${ml}</button>`}
return `<h1>Upload results</h1><p class="sub">Load a CSV to update the leaderboard for everyone.</p><div class="adm"><p>Column 1 is the name, column 2 is the country, and column 3 onward is the points for January, February, March and so on. A heading row is optional.</p><pre>name,country,Jan,Feb,Mar
Mei Lin Tan,Singapore,2310,2480,2600
Arisara Chai,Thailand,1820,2100,2550</pre>
<label for="yr">Year</label><input id="yr" type="number" min="2020" max="2100" value="${dYear}"><label for="csv">CSV file</label><input id="csv" type="file" accept=".csv,.tsv,.txt,text/csv">${d}
<h2 style="margin-top:26px">Uploaded months</h2>${ks.length?ks.map(m=>`<div class="al"><span>${lab(m)} · ${months[m].players.length} rows</span><span class="mut">${fd(months[m].updatedAt)}</span></div>`).join(''):'<p class="mut">Nothing uploaded yet.</p>'}</div>`}
const MX=/(?:^|[^a-z])(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i;
function parse(t){const L=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());if(L.length<1)return{err:'The file is empty.'};
const d=[',','\t',';'].map(c=>[c,L[0].split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
const sp=l=>{const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===d&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(s=>s.trim())};
const H=sp(L[0]);if(H.length<3)return{err:'Needs at least 3 columns: name, country and points for one month.'};
const nh=isFinite(parseFloat(String(H[2]).replace(/[, ]/g,'')));
const mi=[];for(let c=2;c<H.length&&c<14;c++){const m=MX.exec(H[c]),idx=m?MO.findIndex(x=>x.toLowerCase()===m[1].toLowerCase()):c-2;if(idx>=0&&idx<12&&!mi.some(x=>x[1]===idx))mi.push([c,idx])}
const map=new Map();let skip=0;
L.slice(nh?0:1).forEach(l=>{const c=sp(l),name=c[0],country=c[1]||'';if(!name){skip++;return}const v={};mi.forEach(([ci,idx])=>{const x=parseFloat(String(c[ci]||'').replace(/[, ]/g,''));if(isFinite(x)&&x>=0)v[idx]=Math.round(x)});if(!Object.keys(v).length){skip++;return}const id=k(name)+'|'+k(country);map.set(id,{id,name,country,v})});
if(!map.size)return{err:'No valid rows found. Check that the points columns hold numbers.'};
const months=[...new Set([...map.values()].flatMap(r=>Object.keys(r.v).map(Number)))].sort((a,b)=>a-b);
return{rows:[...map.values()],months,skip}}
async function pub(){const y=draft.year;try{for(const m of draft.months){const key=`${y}-${String(m+1).padStart(2,'0')}`,doc={month:key,updatedAt:new Date().toISOString(),players:draft.rows.filter(r=>r.v[m]!==undefined).map(r=>({id:r.id,name:r.name,country:r.country,pts:r.v[m]}))};
if(JSON.stringify(doc).length>240000){toast('The file is too large for '+MO[m]+'. Split it by region and try again.');return}await db.doc('club2500/'+key).set(doc)}
toast('Published '+draft.months.map(m=>MO[m]).join(', ')+' '+y);draft=null;render()}catch(e){toast('Couldn’t save. Check that you have edit access.')}}
function render(){nav();const V={climb,ranks,rewards,alerts:alertsV,me:meV,admin:adminV};$('#view').innerHTML=(V[tab]||climb)();
const t=$('#trail'),pin=$('#pin');if(t&&pin){const L=t.getTotalLength(),pt=t.getPointAtLength(Math.min((myPts()||0)/G,1)*L);pin.style.left=pt.x/360*100+'%';pin.style.top=pt.y/220*100+'%'}}
$('#view').onclick=e=>{const b=e.target.closest('button');if(!b)return;
if(b.id==='log')log();else if(b.id==='pub')pub();
else if(b.dataset.mo){pick=b.dataset.mo;shown=pick;board=months[pick].players;render()}
else if(b.dataset.c!==undefined){const i=+b.dataset.c;prof.claimed.push((shown||'demo')+':'+i);save();note('Claimed '+RW[i][1]);render()}
else if(b.dataset.e){prof.emoji=+b.dataset.e;save();render()}else if(b.dataset.k){prof.color=b.dataset.k;save();render()}
else if(b.dataset.a!==undefined){prof.acc=b.dataset.a;save();render()}};
$('#view').onchange=async e=>{const t=e.target;
if(t.id==='did'){const v=k(t.value),m=mode==='live'?board.find(p=>p.id===v||k(p.name)===v||k(p.name+', '+(p.country||''))===v):null;prof.key=m?m.id:v;save();render()}
else if(t.id==='yr')dYear=t.value;else if(t.id==='cf'){cf=t.value;render()}
else if(t.id==='csv'&&t.files[0]){const r=parse(await t.files[0].text());draft={...r,year:+($('#yr')&&$('#yr').value)||YR};render()}};
function log(){const add=60+Math.random()*160|0,b=demo.pts,r0=rank();demo.pts+=add;
RW.forEach(r=>{if(b<r[0]&&demo.pts>=r[0])note('Reward unlocked: '+r[1])});
if(b<G&&demo.pts>=G)note('You made Club 2500. Welcome to the summit.');else{const r1=rank();note(r1<r0?`+${add} points. You moved up to #${r1}`:`+${add} points logged`)}
render()}
function diff(oldB){const om=new Map(oldB.map(p=>[p.id,p.pts])),n=alerts.length,r0=rankIn(oldB),r1=rankIn(board);
board.forEach(p=>{const o=om.get(p.id);if(o!==undefined&&o<G&&p.pts>=G&&p.id!==prof.key)note(`${p.name} just qualified for Club 2500`)});
const mo=om.get(prof.key),mn=(board.find(p=>p.id===prof.key)||{}).pts;
if(mo!==undefined&&mn!==undefined){RW.forEach(r=>{if(mo<r[0]&&mn>=r[0])note('Reward unlocked: '+r[1])});if(mo<G&&mn>=G)note('You made Club 2500. Welcome to the summit.')}
if(r0&&r1&&r1!==r0)note(r1<r0?`You moved up to #${r1}`:`You dropped to #${r1}`);
if(alerts.length===n)note('Leaderboard updated.')}
